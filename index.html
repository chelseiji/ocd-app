<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCD App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-frame">
        <div class="phone-screen">
            <!-- The first screen thats shows up when the app opens -->
            <div id="loading-screen" class="screen active">
                <!-- SVG at the top of the screen -->
                <div class="svg-container">
                    <img class="group-icon" src="iconlarge-loading.svg" alt="svg loading image">
                </div>
                <!-- The text in the center of the loading screen-->
                <h1 class="app-title">ephemera</h1>
                <!-- Flowers falling from the top of the screen-->
                <div class="flowerfall">
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                </div>
            </div>
            <!-- Onboarding page 1 -->
             <div id ="onboarding1" class="screen">
                 <!-- Onmouse is since the prototype is on a laptop, ontouch is so that it works if i put this on a phone -->
                <img class="skip-button" src="skip-button.svg" alt="skip button"
                     onmousedown="this.src='skip-button-pressed.svg'"
                     onmouseup="this.src='skip-button.svg'"
                     ontouchstart="this.src='skip-button-pressed.svg'"
                     ontouchend="this.src='skip-icon.svg'">
                <p class="progress-text">1/4</p>
                <img class="progress-bar" src="progressbar1.svg" alt="progress bar">
                <h2 class="onboard-heading">your space to take a pause</h2>
                <p class="onboard-subheading">reflect with journal entries</p>
                <img class="onboard-image" src="onboarding-image1.png" alt="onboarding image">
                <div class="continue-button" onclick="showScreen('onboarding2')">
                    continue
                </div>
         </div>
            <!-- Onboarding page 2 -->
            <div id ="onboarding2" class="screen">
                <!-- Onmouse is since the prototype is on a laptop, ontouch is so that it works if i put this on a phone -->
            <img class="skip-button" src="skip-button.svg" alt="skip button"
                    onmousedown="this.src='skip-button-pressed.svg'"
                    onmouseup="this.src='skip-button.svg'"
                    ontouchstart="this.src='skip-button-pressed.svg'"
                    ontouchend="this.src='skip-icon.svg'">
            <p class="progress-text">2/4</p>
            <img class="progress-bar" src="progressbar2.svg" alt="progress bar">
            <h2 class="onboard-heading">notice without pressure</h2>
            <p class="onboard-subheading">track gently, learn about yourself</p>
            <img class="onboard-image" src="onboarding-image2.png" alt="onboarding image">
            <div class="continue-button" onclick="showScreen('onboarding3')">
                continue
            </div>
        </div>
            <!-- Onboarding page 3 -->
            <div id ="onboarding3" class="screen">
                <!-- Onmouse is since the prototype is on a laptop, ontouch is so that it works if i put this on a phone -->
            <img class="skip-button" src="skip-button.svg" alt="skip button"
                    onmousedown="this.src='skip-button-pressed.svg'"
                    onmouseup="this.src='skip-button.svg'"
                    ontouchstart="this.src='skip-button-pressed.svg'"
                    ontouchend="this.src='skip-icon.svg'">
            <p class="progress-text">3/4</p>
            <img class="progress-bar" src="progressbar3.svg" alt="progress bar">
            <h2 class="onboard-heading">a breath at any time</h2>
            <p class="onboard-subheading">a meditation for any occasion</p>
            <img class="onboard-image" src="onboarding-image3.png" alt="onboarding image">
            <div class="continue-button" onclick="showScreen('onboarding3')">
                continue
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
